name: Run F&O Volume Breakout Scanner

on:
  push:
    paths:
      - 'data/raw/**'       # जैसे ही आप data/raw में नई CSV डालेंगे, एक्शन अपने आप चलेगा
      - 'data/master/**'
  workflow_dispatch:        # GitHub वेबसाइट से बटन दबाकर मैन्युअल रन करने के लिए

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Generate Master CSV
        run: python get_nifty500_master.py

      - name: Run Volume Breakout Scanner
        run: python 3_process_data.py

      - name: Commit and Push Processed Scan Result
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/processed/volume_breakout_scan.csv
          git commit -m "Auto-update: Volume Breakout Scan Result Generated" || exit 0
          git push
